<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Dragos Vrabie</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon/android-chrome-512x512.png">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .error-text {
            font-size: 8rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .message {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }
        
        .home-btn {
            background-color: #4c1d95;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 9999px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s, transform 0.3s;
        }
        
        .home-btn:hover {
            background-color: #6d28d9;
            transform: translateY(-3px);
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: var(--opacity);
        }
        
        @keyframes twinkle {
            0%, 100% {
                opacity: var(--opacity);
            }
            50% {
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <h1 class="error-text">404</h1>
        <p class="message">The page you are looking for does not exist.</p>
        <a href="/" class="home-btn">Return home</a>
    </div>
    
    <script>
        // Create stars
        const starsContainer = document.getElementById('stars');
        const starsCount = 100;
        
        for (let i = 0; i < starsCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            // Random position
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            
            // Random size (smaller for lightweight)
            const size = Math.random() * 2 + 0.5;
            
            // Random opacity and animation duration
            const opacity = Math.random() * 0.7 + 0.3;
            const duration = Math.random() * 3 + 2 + 's';
            
            star.style.left = `${x}%`;
            star.style.top = `${y}%`;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.setProperty('--opacity', opacity);
            star.style.setProperty('--duration', duration);
            
            starsContainer.appendChild(star);
        }
    </script>
